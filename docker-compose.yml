# emerald-squirrel 容器部署:docker compose up -d --build
services:
  emerald-squirrel:
    build: .
    image: emerald-squirrel:latest
    container_name: emerald-squirrel
    restart: unless-stopped
    ports:
      - '61127:61127' # 宿主机:容器;容器内端口由 PORT 环境变量决定,改动需两侧同步
    env_file:
      - .env # 不存在时先 cp .env.example .env
    environment:
      # 容器内 localhost 指向容器自身,宿主机上的 LLM 网关 / Ollama 须经 host.docker.internal 访问
      # 端口与宿主机 .env 保持一致;若宿主机服务换了端口,只改这里即可
      LLM_BASE_URL: http://host.docker.internal:29005/v1
      EMBEDDING_BASE_URL: http://host.docker.internal:11434
      DATA_DIR: /data
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ./data:/data # 数据(DB + 上传原件)落在项目内 data/ 目录(已 gitignore);容器以 uid 1000 运行,目录属主须为 uid 1000
